settings:
  timezone: Asia/Jakarta
  lookback_days: 2
  min_duration_seconds: 300
  max_duration_seconds: 14400
  max_media_download_mb: 250
  fuzzy_title_threshold: 92
  keep_keywords:
    - AI
    - agent
    - agents
    - agentic
    - Agentforce
    - AIPCon
    - briefing
    - Claude
    - conference
    - demo
    - developer day
    - DevDay
    - Dreamforce
    - keynote
    - LangChain
    - LangGraph
    - launch
    - model
    - on-demand
    - presentation
    - product
    - Qwen
    - recording
    - release
    - technical
    - webinar
  reject_keywords:
    - fan
    - mirror
    - reaction
    - reupload
    - re-upload
    - rumor
    - stock analysis
    - price target
    - unofficial

vendors:
  - name: OpenAI
    aliases: [ChatGPT]
    verified_speakers:
      - Sam Altman
      - Greg Brockman
      - Brad Lightcap
      - Kevin Weil
      - Mark Chen
      - Jakub Pachocki
    official_domains:
      - openai.com
    youtube_channels:
      - name: OpenAI YouTube
        handle: "@OpenAI"
        proof: Official OpenAI YouTube channel allowlisted by handle.
    event_pages:
      - name: OpenAI DevDay
        url: https://openai.com/devday/
        proof: OpenAI-owned DevDay page.

